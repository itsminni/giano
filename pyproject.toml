[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "giano"
version = "2.0.0"
description = "Training, reconstruction and evaluation for hourly weather station networks"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["numpy>=1.24,<3","filelock>=4.2.1,<5","torch>=2.1,<3","xarray>=2023.1","pandas>=2,<4","h5netcdf[h5py]>=1.3,<2"]

[dependency-groups]
dev = ["pytest>=9,<10", "ruff>=0.9,<1", "mypy>=1.5,<2", "pandas-stubs>=2,<3.1"]

notebooks = ["jupyterlab>=4.4,<5", "ipykernel>=6.29,<8", "matplotlib>=3.6,<4", "nbconvert>=7,<8"]

[project.scripts]
giano = "giano.fill:main"
giano-import-trentino = "giano.trentino:main"
giano-evaluate = "giano.evaluate:main"
giano-prepare = "giano.prepare:main"
giano-train = "giano.train:main"
giano-fill = "giano.fill:main"

[tool.setuptools.package-data]
giano = ["weights/*.pt", "weights/*.json", "weights/*.npz", "protocol/*.json", "protocol/*.pt", "protocol/*.npz", "protocol/*.md"]

[tool.pytest.ini_options]
pythonpath = ["src", "examples"]
testpaths = ["tests"]

[tool.pyright]
extraPaths = ["src", "examples"]

[tool.ruff.lint]
select = ["B", "E4", "E7", "E9", "F", "I", "S", "UP"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101"]
