[build-system]
requires = ["uv_build>=0.12.5,<0.13"]
build-backend = "uv_build"

[project]
name = "giano"
version = "1.0.0"
description = "Coordinate-inductive ImputeFormer for meteorological data imputation"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "filelock>=3.32.3,<4",
    "torch>=2.1.0,<3",
    "numpy>=1.24.0,<3",
    "pandas>=2.0.0,<4",
    "xarray>=2023.1.0,<2027",
    "h5netcdf[h5py]>=1.3.0,<2",
    "pyyaml>=6.0,<7",
]

[project.scripts]
giano = "giano.pipeline:main"
giano-dataset = "giano.data_processing.import_dataset:main"
giano-benchmark-bilstm = "giano.evaluation.gapfill.benchmark_bilstm:main"
giano-benchmark-imputeformer = "giano.evaluation.gapfill.benchmark_imputeformer:main"
giano-analyze-gapfill = "giano.evaluation.gapfill.analyze:main"
giano-analyze-detailed = "giano.evaluation.gapfill.detailed:main"
giano-evaluate-downstream = "giano.evaluation.forecasting.run:main"
giano-impute = "giano.impute:main"
giano-export-onnx = "giano.model.export_onnx:main"
giano-export-reconstruction-example = "giano.evaluation.gapfill.reconstruction_example:main"
giano-train-bilstm = "giano.baselines.train_bilstm:main"
giano-train-imputeformer = "giano.model.train_imputeformer:main"

[dependency-groups]
dev = [
    "matplotlib>=3.6.0,<4",
    "pytest>=9.0.3,<10",
    "ruff>=0.9.0,<1",
    "mypy>=1.5.0,<2",
    "pandas-stubs>=2.0.0,<3.1",
    "types-PyYAML>=6.0.0,<7",
]
notebooks = [
    "ipykernel>=6.29,<8",
    "jupyter-server>=2.21.0,<3",
    "jupyterlab>=4.4,<5",
    "matplotlib>=3.6.0,<4",
]
onnx = [
    "onnx>=1.20.0,<2",
    "onnxruntime>=1.24.0,<2",
]

[tool.uv]
default-groups = ["dev"]

[tool.uv.build-backend]
module-root = "src"
module-name = "giano"

[tool.ruff]
target-version = "py311"
line-length = 88

[tool.ruff.lint]
select = [
    "B",
    "E",
    "F",
    "I",
    "S",
    "UP",
]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = [
    "D",
    "INP001",
    "S101",
]
