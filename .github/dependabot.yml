version: 2

# Keep independent ecosystems and bounded website groups so Dependabot's
# signed commit metadata is not truncated by oversized update batches.
updates:
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "07:00"
      timezone: Europe/Rome
    open-pull-requests-limit: 1
    # Version filters do not suppress major security fixes.
    allow:
      - dependency-type: all
        update-types: [version-update:semver-minor, version-update:semver-patch]
    groups:
      python:
        applies-to: version-updates
        patterns: ["*"]
      python-security:
        applies-to: security-updates
        patterns: ["*"]

  - package-ecosystem: bun
    directory: /website/giano-weather-vision
    schedule:
      interval: weekly
      day: monday
      time: "07:00"
      timezone: Europe/Rome
    open-pull-requests-limit: 5
    allow:
      - dependency-name: "*"
        update-types: [version-update:semver-minor, version-update:semver-patch]
    groups:
      react:
        applies-to: version-updates
        patterns: [react, react-dom, "@types/react", "@types/react-dom"]
      radix:
        applies-to: version-updates
        patterns: ["@radix-ui/*"]
      framework:
        applies-to: version-updates
        patterns:
          - "@tanstack/*"
          - "@vitejs/*"
          - "@tailwindcss/*"
          - vite
          - vite-tsconfig-paths
          - tailwindcss
          - nitro
      tooling:
        applies-to: version-updates
        patterns:
          - "@eslint/*"
          - "eslint*"
          - "@types/bun"
          - "@types/node"
          - typescript
          - typescript-eslint
          - "@typescript-eslint/*"
          - prettier
      website:
        applies-to: version-updates
        patterns: ["*"]
      website-security:
        applies-to: security-updates
        patterns: ["*"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "07:00"
      timezone: Europe/Rome
    open-pull-requests-limit: 1
    allow:
      - dependency-name: "*"
        update-types: [version-update:semver-minor, version-update:semver-patch]
    groups:
      actions:
        applies-to: version-updates
        patterns: ["*"]
      actions-security:
        applies-to: security-updates
        patterns: ["*"]
