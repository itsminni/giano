name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Auto-merge policy tests
        run: node --test .github/tests/dependabot-automerge.cjs

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.5"
          enable-cache: true

      - name: Install Python
        run: uv python install 3.11

      - name: Sync locked environment
        run: uv sync --locked --python 3.11

      - name: Ruff lint
        run: uv run --locked ruff check .

      - name: Ruff format
        run: uv run --locked ruff format --check .

      - name: Syntax check
        run: uv run --locked python -m compileall -q src tests

      - name: Unit tests
        run: uv run --locked pytest -q

      - name: Type check
        run: uv run --locked mypy src/giano tests notebooks/release_artifacts.py tools

      - name: Build wheel
        run: uv build --wheel

      - name: CLI smoke checks
        run: |
          uv run --locked giano --help
          uv run --locked giano-dataset --help
          uv run --locked giano-train-bilstm --help
          uv run --locked giano-benchmark-bilstm --help
          uv run --locked giano-train-imputeformer --help
          uv run --locked giano-benchmark-imputeformer --help
          uv run --locked giano-analyze-gapfill --help
          uv run --locked giano-analyze-detailed --help
          uv run --locked giano-evaluate-downstream --help
          uv run --locked giano-export-onnx --help
          uv run --locked giano-export-reconstruction-example --help
          uv run --locked giano-impute --help
          uv run --locked python -m giano.training_campaign --help
          uv run --locked python -m giano.evaluation.campaign --help
          uv run --locked python tools/prepare_release.py --help

      - name: Dependency audit
        run: uv --preview-features audit-command audit --locked

  website:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: website/giano-weather-vision
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.4.4"

      - name: Install locked dependencies
        run: bun install --frozen-lockfile

      - name: Audit dependencies
        run: bun audit

      - name: Cache released website data
        id: data
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: artifacts/website/giano-history
          key: giano-history-v1-9be018746c4c312859ca4e11e654834e2b18ed7e87133c69284bb64865d58408

      - name: Download and verify released website data
        if: steps.data.outputs.cache-hit != 'true'
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release download v1.0.0 --pattern giano-1.0.0-artifacts.zip --dir "$RUNNER_TEMP"
          echo "9be018746c4c312859ca4e11e654834e2b18ed7e87133c69284bb64865d58408  $RUNNER_TEMP/giano-1.0.0-artifacts.zip" | sha256sum --check
          python - "$RUNNER_TEMP/giano-1.0.0-artifacts.zip" <<'PY'
          import sys
          import zipfile
          from pathlib import PurePosixPath

          prefix = "artifacts/website/giano-history/"
          with zipfile.ZipFile(sys.argv[1]) as archive:
              members = [name for name in archive.namelist() if name.startswith(prefix)]
              assert prefix + "manifest.json" in members, "Missing website data"
              assert all(".." not in PurePosixPath(name).parts for name in members)
              archive.extractall(".", members=members)
          PY
          rm "$RUNNER_TEMP/giano-1.0.0-artifacts.zip"

      - name: Prepare and verify website data
        run: bun run prepare:data

      - name: Type check
        run: bun run check

      - name: Unit tests
        run: bun test

      - name: Lint
        run: bun run lint

      - name: Build website
        run: bun run build

      - name: Build GitHub Pages website
        run: bun run build:pages
